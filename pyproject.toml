[project]
name = "vla-finetuning"
version = "0.1.0"
description = "Distributed LoRA fine-tuning of a Vision-Language-Action model for robotic manipulation"
# lerobot >=0.5 requires 3.12
requires-python = ">=3.12,<3.13"
dependencies = [
    # 0.6.x: LIBERO ports need dataset v3.0; 0.4.x pi0 is unresolvable
    "lerobot[pi,peft,training]>=0.6.1,<0.7",
    # lerobot 0.6.1's own bounds, restated so the CUDA index resolves the newest
    "torch>=2.11,<2.12",
    # must share torch's index (torchvision::nms)
    "torchvision>=0.26,<0.27",
    # PyPI CPU build on purpose: the cu128 build needs NPP
    "torchcodec>=0.11,<0.12",
    "numpy>=2.0",
]

[tool.uv]
# application, not a library
package = false

# explicit cu128 wheels on Linux (auto-detection on a GPU-less login node picks CPU builds);
# cu128 carries torch 2.11, the newest lerobot 0.6.1 allows
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
# Hub READMEs, must stay byte-identical to the Hub copies
extend-exclude = ["model_cards"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
